# Houston целиком: Qdrant + API + интерфейс (+ разовая индексация).
#
# Первый запуск (из корня репозитория):
#   docker compose -f infra/docker-compose.yml up -d --build qdrant
#   docker compose -f infra/docker-compose.yml --profile init run --rm indexer   # один раз, несколько минут на CPU
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Дальше: docker compose -f infra/docker-compose.yml up -d
# API: http://localhost:8000/docs   Интерфейс: http://localhost:8501   Qdrant: http://localhost:6333/dashboard
#
# Секреты (ключ LLM и т.п.) кладите в .env в корне репозитория: он не попадает в git и в образ.

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: houston-app
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    QDRANT_URL: http://qdrant:6333
    FASTEMBED_CACHE_PATH: /cache
  volumes:
    - fastembed_cache:/cache   # модели эмбеддингов (~0.5 ГБ) скачиваются один раз

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: aerorag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + веб-дашборд
      - "6334:6334"   # gRPC
    volumes:
      - ../qdrant_storage:/qdrant/storage

  api:
    <<: *app
    container_name: houston-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  ui:
    <<: *app
    container_name: houston-ui
    command: streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      <<: *app-env
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  indexer:
    <<: *app
    container_name: houston-indexer
    profiles: ["init"]          # запускается только вручную, см. команду выше
    restart: "no"
    command: python -m src.retrieval.index_qdrant
    depends_on:
      - qdrant

volumes:
  fastembed_cache:
